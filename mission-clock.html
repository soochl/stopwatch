<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>미션 클록 · MET / T-minus</title>
<style>
  :root {
    --bg:#05080d; --panel:#0b111a; --line:#1c2a3a; --text:#d8e6f3; --dim:#6b8299;
    --go:#2bd96b; --hold:#ffb020; --abort:#ff4d4d; --acc:#4cc2ff;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; }
  body { background:var(--bg); color:var(--text); font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace; }
  body { background:
      radial-gradient(60vmax 40vmax at 85% 10%, rgba(120,60,200,.22), transparent 70%),
      radial-gradient(50vmax 40vmax at 10% 90%, rgba(30,110,200,.20), transparent 70%),
      radial-gradient(40vmax 30vmax at 50% 50%, rgba(200,60,120,.07), transparent 70%),
      var(--bg); background-attachment:fixed; overflow-x:hidden; }
  #stars { position:fixed; inset:0; width:100%; height:100%; z-index:0; pointer-events:none; }
  .wrap { position:relative; z-index:2; max-width:1100px; margin:0 auto; padding:16px; display:grid; gap:12px; }
  .panel { background:rgba(8,14,24,.72); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
           border:1px solid var(--line); border-radius:6px; padding:14px 18px; }

  /* ---- 행성 (순수 CSS) ---- */
  .planet { position:fixed; z-index:1; border-radius:50%; pointer-events:none; }
  .earth { width:min(55vmin,520px); aspect-ratio:1; left:-14vmin; bottom:-22vmin;
    background:
      radial-gradient(circle at 30% 28%, rgba(255,255,255,.28), transparent 38%),
      radial-gradient(circle at 70% 75%, rgba(0,0,20,.75), transparent 60%),
      radial-gradient(ellipse 22% 14% at 30% 40%, #3f8f4f 60%, transparent 62%),
      radial-gradient(ellipse 16% 24% at 58% 62%, #4a9a55 60%, transparent 62%),
      radial-gradient(ellipse 20% 10% at 70% 30%, #3a7d48 60%, transparent 62%),
      radial-gradient(ellipse 30% 8% at 40% 20%, rgba(255,255,255,.55) 50%, transparent 55%),
      radial-gradient(ellipse 26% 7% at 62% 78%, rgba(255,255,255,.45) 50%, transparent 55%),
      #1b5fb0;
    box-shadow:0 0 0 2px rgba(110,180,255,.25), 0 0 60px 10px rgba(80,160,255,.45), inset -30px -20px 70px rgba(0,0,0,.7);
    animation:earthSpin 120s linear infinite; }
  @keyframes earthSpin { to { background-position:0 0, 0 0, 120% 0, 120% 0, 120% 0, 80% 0, 80% 0, 0 0; } }
  .saturn { width:min(14vmin,130px); aspect-ratio:1; right:7vw; top:12vh;
    background:radial-gradient(circle at 32% 30%, #f7e2b0, #d6a95c 55%, #7a5624 100%);
    box-shadow:inset -10px -8px 24px rgba(0,0,0,.65), 0 0 30px rgba(255,200,120,.25);
    animation:bob 9s ease-in-out infinite; }
  .saturn::before { content:""; position:absolute; left:-55%; right:-55%; top:50%; height:0; padding-bottom:0;
    border:7px solid rgba(235,210,160,.75); border-radius:50%; height:30%; transform:translateY(-50%) rotate(-18deg);
    box-shadow:0 0 0 5px rgba(200,170,120,.35); clip-path:inset(50% -10% -10% -10%); }
  .saturn::after { content:""; position:absolute; left:-55%; right:-55%; top:50%; height:30%;
    border:7px solid rgba(235,210,160,.75); border-radius:50%; transform:translateY(-50%) rotate(-18deg);
    box-shadow:0 0 0 5px rgba(200,170,120,.35); clip-path:inset(-10% -10% 50% -10%); z-index:-1; }
  .mars { width:min(5vmin,48px); aspect-ratio:1; right:22vw; bottom:16vh;
    background:radial-gradient(circle at 32% 30%, #ffb08a, #c1502e 60%, #5a1e0e 100%);
    box-shadow:inset -5px -4px 10px rgba(0,0,0,.6), 0 0 14px rgba(255,110,70,.3);
    animation:bob 7s ease-in-out infinite reverse; }
  .moon { width:min(4vmin,38px); aspect-ratio:1; left:34vw; top:9vh;
    background:radial-gradient(circle at 32% 30%, #f2f2f2, #9a9a9a 65%, #4a4a4a 100%);
    box-shadow:inset -4px -3px 9px rgba(0,0,0,.6); animation:bob 11s ease-in-out infinite; }
  @keyframes bob { 50% { transform:translateY(-12px); } }
  @media (max-width:640px) { .saturn { right:-2vw; top:auto; bottom:30vh; opacity:.7; } .mars, .moon { display:none; } }
  @media (prefers-reduced-motion:reduce) { .planet { animation:none !important; } }

  /* ---- 시계 패널의 궤도 ---- */
  .clock { position:relative; overflow:hidden; }
  .clock > :not(#orbit) { position:relative; z-index:1; }
  #orbit { position:absolute; inset:0; width:100%; height:100%; z-index:0; pointer-events:none; }
  #orbit ellipse { fill:none; stroke:rgba(76,194,255,.28); stroke-width:1; stroke-dasharray:3 6; }
  #sat { fill:var(--acc); filter:drop-shadow(0 0 6px var(--acc)); }
  .label { font-size:11px; letter-spacing:.2em; color:var(--dim); text-transform:uppercase; }

  header { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; }
  .utc { font-size:20px; color:var(--acc); font-variant-numeric:tabular-nums; }
  .status { display:flex; align-items:center; gap:8px; font-weight:700; letter-spacing:.15em; }
  .dot { width:12px; height:12px; border-radius:50%; background:var(--dim); }
  .status.go .dot { background:var(--go); box-shadow:0 0 10px var(--go); }
  .status.hold .dot { background:var(--hold); box-shadow:0 0 10px var(--hold); }
  .status.go { color:var(--go); } .status.hold { color:var(--hold); }

  .clock { text-align:center; padding:28px 12px; }
  #prefix { font-size:clamp(20px,4vw,32px); color:var(--dim); margin-right:8px; }
  #time { font-size:clamp(44px,13vw,140px); font-weight:600; font-variant-numeric:tabular-nums; letter-spacing:.02em; line-height:1.1; }
  #ms { font-size:.5em; color:var(--dim); }
  .clock.minus #time { color:var(--hold); } .clock.plus #time { color:var(--go); }
  .clock.flash { animation:flash .6s 3; }
  @keyframes flash { 50% { background:#2a1d00; } }

  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  button, select, input { font:inherit; color:var(--text); background:#101a27; border:1px solid var(--line); border-radius:4px; padding:10px 16px; }
  button { cursor:pointer; letter-spacing:.1em; font-weight:700; }
  button:hover:not(:disabled) { border-color:var(--acc); }
  button:disabled { opacity:.35; cursor:default; }
  button:focus-visible, input:focus-visible { outline:2px solid var(--acc); outline-offset:2px; }
  #go.running { background:#3a1111; border-color:var(--abort); color:var(--abort); }
  #go:not(.running) { background:#0f2d1b; border-color:var(--go); color:var(--go); }
  .grow { flex:1; min-width:110px; }
  input[type=number] { width:72px; text-align:center; }
  .seg { display:inline-flex; } .seg button { border-radius:0; } .seg button:first-child { border-radius:4px 0 0 4px; } .seg button:last-child { border-radius:0 4px 4px 0; }
  .seg button.on { background:var(--acc); color:#001018; border-color:var(--acc); }
  #cd[hidden] { display:none; }

  table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
  th,td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); }
  th { font-size:11px; letter-spacing:.15em; color:var(--dim); font-weight:400; }
  .tablewrap { max-height:260px; overflow:auto; }
  .hint { color:var(--dim); font-size:12px; }
  kbd { border:1px solid var(--line); border-radius:3px; padding:1px 6px; color:var(--text); }
</style>
</head>
<body>
<canvas id="stars" aria-hidden="true"></canvas>
<div class="planet earth" aria-hidden="true"></div>
<div class="planet saturn" aria-hidden="true"></div>
<div class="planet mars" aria-hidden="true"></div>
<div class="planet moon" aria-hidden="true"></div>
<div class="wrap">
  <header class="panel">
    <div><div class="label">UTC</div><div class="utc" id="utc">--:--:--</div></div>
    <div class="status" id="status" role="status" aria-live="polite"><span class="dot"></span><span id="statusText">STANDBY</span></div>
    <div><div class="label">모드</div>
      <div class="seg" role="group" aria-label="모드">
        <button id="mMet" class="on">MET</button><button id="mCd">T-MINUS</button>
      </div>
    </div>
  </header>

  <section class="panel clock" id="clock" aria-label="미션 시계">
    <svg id="orbit" viewBox="0 0 1000 300" preserveAspectRatio="none" aria-hidden="true">
      <ellipse cx="500" cy="150" rx="470" ry="125"/><circle id="sat" r="5" cx="970" cy="150"/>
    </svg>
    <div class="label" id="modeLabel">MISSION ELAPSED TIME</div>
    <div><span id="prefix">T+</span><span id="time">00:00:00</span><span id="ms">.000</span></div>
  </section>

  <section class="panel">
    <div class="row">
      <button id="go" class="grow">START</button>
      <button id="split" class="grow" disabled>SPLIT</button>
      <button id="reset" class="grow" disabled>RESET</button>
      <button id="csv" disabled>CSV 내보내기</button>
    </div>
    <div class="row" id="cd" hidden style="margin-top:12px">
      <span class="label">카운트다운 설정</span>
      <input type="number" id="h" min="0" max="99" value="0" aria-label="시"> :
      <input type="number" id="m" min="0" max="59" value="0" aria-label="분"> :
      <input type="number" id="s" min="0" max="59" value="10" aria-label="초">
      <span class="hint">0 도달 후 T+ 로 계속 진행</span>
    </div>
    <p class="hint">단축키: <kbd>Space</kbd> 시작/정지 · <kbd>S</kbd> 스플릿 · <kbd>R</kbd> 리셋 · 새로고침해도 상태가 유지됩니다.</p>
  </section>

  <section class="panel">
    <div class="label">SPLIT LOG</div>
    <div class="tablewrap"><table>
      <thead><tr><th>#</th><th>MET / T</th><th>Δ 구간</th><th>UTC</th></tr></thead>
      <tbody id="log"></tbody>
    </table></div>
  </section>
</div>

<script>
const $ = id => document.getElementById(id);
const KEY = 'missionClock.v1';
const pad = (n, w = 2) => String(n).padStart(w, '0');

// 상태: 벽시계(Date.now) 기반이라 탭이 백그라운드여도 드리프트가 없고, 새로고침 후 복원 가능
let st = { mode:'met', acc:0, t0:null, target:10000, laps:[], lastLap:0 };
try { Object.assign(st, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch {} };

const elapsed = () => st.acc + (st.t0 ? Date.now() - st.t0 : 0);
// 표시값: MET 모드는 경과시간, T-minus 모드는 (경과 - 목표). 음수면 T-, 양수면 T+
const value = () => st.mode === 'cd' ? elapsed() - st.target : elapsed();

function parts(ms) {
  const a = Math.abs(ms);
  return { t:`${pad(Math.floor(a/3600000))}:${pad(Math.floor(a/60000)%60)}:${pad(Math.floor(a/1000)%60)}`, ms:pad(a%1000, 3) };
}
const label = ms => { const p = parts(ms); return `${st.mode==='cd' ? (ms<0?'T−':'T+') : 'T+'} ${p.t}.${p.ms}`; };

let lastSign = null;
function render() {
  const v = value(), p = parts(v);
  const neg = st.mode === 'cd' && v < 0;
  $('time').textContent = p.t;
  $('ms').textContent = '.' + p.ms;
  $('prefix').textContent = st.mode === 'cd' ? (neg ? 'T−' : 'T+') : 'T+';
  $('clock').classList.toggle('minus', neg && !!st.t0);
  $('clock').classList.toggle('plus', st.t0 && !neg);
  if (st.mode === 'cd' && st.t0 && lastSign === true && !neg) { // 리프트오프: 0 통과
    const c = $('clock'); c.classList.remove('flash'); void c.offsetWidth; c.classList.add('flash');
  }
  lastSign = neg;
  $('utc').textContent = new Date().toISOString().slice(11, 19);
  // 위성: 60초에 궤도 한 바퀴
  const a = (elapsed() % 60000) / 60000 * Math.PI * 2 - Math.PI / 2;
  $('sat').setAttribute('cx', 500 + 470 * Math.cos(a));
  $('sat').setAttribute('cy', 150 + 125 * Math.sin(a));
}

// ---- 별 배경: 반짝이는 별 3겹(시차) + 가끔 유성 ----
(function stars() {
  const cv = $('stars'), cx = cv.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W, H, field = [], meteors = [];
  const build = () => {
    const d = devicePixelRatio || 1;
    W = cv.width = innerWidth * d; H = cv.height = innerHeight * d;
    const n = Math.round(innerWidth * innerHeight / 3500);
    field = Array.from({ length: n }, () => {
      const layer = Math.random();
      return { x:Math.random() * W, y:Math.random() * H, r:(0.4 + layer * 1.3) * d, v:(0.02 + layer * 0.08) * d,
               ph:Math.random() * 6.28, sp:0.5 + Math.random() * 2,
               c:['#ffffff','#cfe3ff','#ffe9c4','#ffd0d0'][Math.floor(Math.random() * 4)] };
    });
  };
  addEventListener('resize', build); build();
  let last = 0;
  (function frame(t) {
    const dt = Math.min(50, t - last); last = t;
    cx.clearRect(0, 0, W, H);
    for (const s of field) {
      if (!reduce) { s.x -= s.v * dt / 16; if (s.x < 0) s.x = W; }
      cx.globalAlpha = reduce ? .8 : .45 + .55 * Math.abs(Math.sin(t / 1000 * s.sp + s.ph));
      cx.fillStyle = s.c; cx.beginPath(); cx.arc(s.x, s.y, s.r, 0, 6.283); cx.fill();
    }
    if (!reduce && Math.random() < 0.004) {
      const d = devicePixelRatio || 1;
      meteors.push({ x:Math.random() * W, y:Math.random() * H * .5, vx:-(8 + Math.random() * 6) * d, vy:(4 + Math.random() * 3) * d, life:1 });
    }
    meteors = meteors.filter(m => m.life > 0);
    for (const m of meteors) {
      const g = cx.createLinearGradient(m.x, m.y, m.x - m.vx * 6, m.y - m.vy * 6);
      g.addColorStop(0, `rgba(255,255,255,${m.life})`); g.addColorStop(1, 'rgba(255,255,255,0)');
      cx.globalAlpha = 1; cx.strokeStyle = g; cx.lineWidth = 1.6 * (devicePixelRatio || 1);
      cx.beginPath(); cx.moveTo(m.x, m.y); cx.lineTo(m.x - m.vx * 6, m.y - m.vy * 6); cx.stroke();
      m.x += m.vx; m.y += m.vy; m.life -= 0.015;
    }
    requestAnimationFrame(frame);
  })(0);
})();

function ui() {
  const run = !!st.t0;
  $('go').textContent = run ? 'STOP' : 'START';
  $('go').classList.toggle('running', run);
  $('split').disabled = !run;
  $('reset').disabled = !run && elapsed() === 0;
  $('csv').disabled = !st.laps.length;
  const s = $('status');
  s.className = 'status ' + (run ? 'go' : elapsed() ? 'hold' : '');
  $('statusText').textContent = run ? 'CLOCK RUNNING' : elapsed() ? 'HOLD' : 'STANDBY';
  $('mMet').classList.toggle('on', st.mode === 'met');
  $('mCd').classList.toggle('on', st.mode === 'cd');
  $('cd').hidden = st.mode !== 'cd';
  $('modeLabel').textContent = st.mode === 'cd' ? 'COUNTDOWN · T-MINUS' : 'MISSION ELAPSED TIME';
  for (const el of ['h','m','s']) $(el).disabled = !!st.t0 || elapsed() > 0;
}

function drawLog() {
  $('log').innerHTML = st.laps.slice().reverse().map(l =>
    `<tr><td>${l.n}</td><td>${l.label}</td><td>+${l.delta}</td><td>${l.utc}</td></tr>`).join('');
}

function toggle() {
  if (st.t0) { st.acc += Date.now() - st.t0; st.t0 = null; }
  else {
    if (st.mode === 'cd' && elapsed() === 0) readTarget();
    st.t0 = Date.now();
  }
  save(); ui(); render();
}
function split() {
  if (!st.t0) return;
  const v = value(), e = elapsed();
  const p = parts(e - st.lastLap);
  st.laps.push({ n: st.laps.length + 1, label: label(v), delta: `${p.t}.${p.ms}`, utc: new Date().toISOString().slice(11, 23) });
  st.lastLap = e;
  save(); drawLog(); ui();
}
function reset() {
  st.acc = 0; st.t0 = null; st.laps = []; st.lastLap = 0; lastSign = null;
  save(); drawLog(); ui(); render();
}
function readTarget() {
  const n = (id, max) => Math.min(max, Math.max(0, parseInt($(id).value) || 0));
  st.target = ((n('h',99) * 60 + n('m',59)) * 60 + n('s',59)) * 1000;
}
function setMode(m) {
  if (st.t0 || elapsed() > 0) { if (!confirm('모드를 바꾸면 현재 기록이 초기화됩니다. 계속할까요?')) return; reset(); }
  st.mode = m; if (m === 'cd') readTarget(); save(); ui(); render();
}
function exportCsv() {
  const rows = [['n','time','delta','utc'], ...st.laps.map(l => [l.n, l.label, l.delta, l.utc])];
  const blob = new Blob([rows.map(r => r.join(',')).join('\n')], { type:'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `mission-clock-${new Date().toISOString().replace(/[:.]/g,'-')}.csv`;
  a.click(); URL.revokeObjectURL(a.href);
}

$('go').onclick = toggle; $('split').onclick = split; $('reset').onclick = reset; $('csv').onclick = exportCsv;
$('mMet').onclick = () => st.mode !== 'met' && setMode('met');
$('mCd').onclick = () => st.mode !== 'cd' && setMode('cd');
for (const id of ['h','m','s']) $(id).onchange = () => { readTarget(); save(); render(); };
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.metaKey || e.ctrlKey) return;
  if (e.code === 'Space') { e.preventDefault(); if (document.activeElement.tagName === 'BUTTON') document.activeElement.blur(); toggle(); }
  else if (e.key.toLowerCase() === 's') split();
  else if (e.key.toLowerCase() === 'r') reset();
});

// 입력창 값 복원
const T = Math.floor(st.target / 1000);
$('h').value = Math.floor(T / 3600); $('m').value = Math.floor(T / 60) % 60; $('s').value = T % 60;
drawLog(); ui(); render();
(function loop() { render(); requestAnimationFrame(loop); })();
</script>
</body>
</html>
